# CI-ONLY trigger file for a fork branch. Not part of the PR.
name: windows-check
on:
  push:
    branches: ['ci/handle-ctor']
  workflow_dispatch:
jobs:
  msvc-syntax:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        sdk:
          - { name: master, url: 'https://github.com/WopsS/RED4ext.SDK.git', ref: master }
          - { name: handle-ctor, url: 'https://github.com/codeman101/RED4ext.SDK-macos.git', ref: pr/handle-converting-ctor }
    name: MSVC, SDK ${{ matrix.sdk.name }}
    steps:
      - uses: actions/checkout@v4
      - name: RED4ext.SDK
        run: git clone --depth 1 --branch ${{ matrix.sdk.ref }} ${{ matrix.sdk.url }} sdk
      - name: Write test unit
        shell: bash
        run: |
          cat > t.cpp <<'CPP'
          #include <RedLib.hpp>
          #include <RED4ext/Scripting/Natives/Generated/game/IGameSystem.hpp>
          struct MySystem : Red::IGameSystem { RTTI_IMPL_TYPEINFO(MySystem); RTTI_IMPL_ALLOCATOR(); };
          RTTI_DEFINE_CLASS(MySystem);
          void f(Red::DynArray<Red::Handle<Red::IScriptable>>& a, Red::Handle<MySystem>& h)
          {
              a.EmplaceBack(h);
              Red::Handle<Red::IScriptable> b(h);
              Red::Handle<Red::IScriptable> c(std::move(h));
          }
          CPP
      - name: cl /Zs
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++20 /EHsc /Zs /DNOMINMAX /DWIN32_LEAN_AND_MEAN /Isdk\include /Iinclude /Ivendor /Ivendor\nameof\include t.cpp

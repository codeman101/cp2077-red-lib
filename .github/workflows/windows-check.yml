# CI-ONLY trigger file for a fork branch. Do not include in the PR. Not run yet.
name: windows-check
on:
  push:
    branches: ['**']
  workflow_dispatch:
jobs:
  msvc-syntax:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: RED4ext.SDK (WopsS, the one RedLib builds against on Windows)
        run: git clone --depth 1 https://github.com/WopsS/RED4ext.SDK.git sdk
      - name: Write test unit
        shell: bash
        run: |
          cat > t.cpp <<'CPP'
          #include <RedLib.hpp>
          #include <string_view>
          #include <RED4ext/Scripting/Natives/Generated/game/AppearanceSource.hpp>
          enum class MyEnum : int32_t { A, B };
          struct MyThing : Red::IScriptable { RTTI_IMPL_TYPEINFO(MyThing); RTTI_IMPL_ALLOCATOR(); int32_t value = 0; };
          RTTI_DEFINE_ENUM(MyEnum);
          RTTI_DEFINE_CLASS(MyThing, { RTTI_PROPERTY(value); });
          constexpr auto n1 = Red::GetTypeNameStr<RED4ext::game::AppearanceSource>();
          static_assert(std::string_view(n1.data()) == "gameAppearanceSource");
          constexpr auto n2 = Red::GetTypeNameStr<RED4ext::IScriptable>();
          static_assert(std::string_view(n2.data()) == "IScriptable");
          void f() { Red::TypeInfoRegistrar::RunPending(); }
          CPP
      - name: cl /Zs
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++20 /EHsc /Zs /DNOMINMAX /DWIN32_LEAN_AND_MEAN /Isdk\include /Iinclude /Ivendor\nameof\include t.cpp
